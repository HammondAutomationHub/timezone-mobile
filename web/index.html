<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TimeZoneMobile is a local world clock. Daylight saving is automatic, and your places stay on this device.">
  <meta name="theme-color" content="#101418">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Flutter resets the viewport to the monitor width. On an installed
    // desktop window, put it back to the frame width whenever that happens.
    (function () {
      var desktopApp = window.matchMedia('(display-mode: standalone), (display-mode: minimal-ui), (display-mode: window-controls-overlay)').matches
        && !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      if (!desktopApp) return;

      function windowWidth() {
        var visual = window.visualViewport && window.visualViewport.width;
        var width = window.innerWidth;
        if (visual && visual > 0 && visual < width) width = visual;
        if (window.outerWidth > 0 && window.outerWidth < width) width = window.outerWidth;
        return Math.max(1, Math.round(width));
      }

      function sync() {
        var viewport = document.querySelector('meta[name="viewport"]');
        if (!viewport) return;
        var next = 'width=' + windowWidth() + ', initial-scale=1, viewport-fit=cover';
        if (viewport.getAttribute('content') !== next) {
          viewport.setAttribute('content', next);
          window.dispatchEvent(new Event('resize'));
        }
      }

      var frame = 0;
      function schedule() {
        if (frame) return;
        frame = window.requestAnimationFrame(function () {
          frame = 0;
          sync();
        });
      }

      new MutationObserver(schedule).observe(document.head, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['content'],
      });
      window.addEventListener('resize', schedule);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', schedule);
      schedule();
    })();
  </script>

  <!-- Installed app on Android, iOS, and desktop. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TimeZoneMobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TimeZoneMobile</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      position: fixed;
      inset: 0;
      margin: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #101418;
    }
  </style>
</head>
<body>
  <script>
    // Keep Chrome's install event until the Install button asks for it.
    window.__tzInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__tzInstallPrompt = event;
    });
    window.addEventListener('appinstalled', function () {
      window.__tzInstallPrompt = null;
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
